<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Problem Solver</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <header class="page-header">
            <span class="eyebrow">DEVELOPER TOOLS</span>
            <h1>Code Workbench</h1>
            <p>Describe a programming challenge and get a solution to work with.</p>
        </header>
        <section class="workspace" aria-labelledby="problem-heading">
            <div class="section-heading">
                <div>
                    <h2 id="problem-heading">Problem</h2>
                    <p>Include the requirements and any relevant details.</p>
                </div>
            </div>
            <label for="language">Programming language</label>
            <select id="language">
                <option value="Python">Python</option>
                <option value="JavaScript">JavaScript</option>
                <option value="Java">Java</option>
                <option value="C++">C++</option>
                <option value="C#">C#</option>
                <option value="Go">Go</option>
                <option value="Rust">Rust</option>
            </select>
            <label for="problem">Problem description</label>
            <textarea
                id="problem"
                placeholder="Describe the programming problem you want to solve..."
            ></textarea>
            <p id="problemError" class="problem-error" role="alert"></p>

            <button id="solveBtn" type="button">Generate solution</button>
        </section>

        <section class="conversation-panel" aria-labelledby="conversation-heading">
            <div class="section-heading result-heading">
                <div>
                    <h2 id="conversation-heading">Conversation</h2>
                    <p>Your questions and solutions will appear here.</p>
                </div>
            </div>
            <div id="conversationList" class="conversation-list" role="log" aria-live="polite" aria-relevant="additions">
                <p id="conversationEmpty" class="conversation-empty">Ask a programming question to start a conversation.</p>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
